<!doctype html>
<html lang="en" style="background-color: #000000">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Streaking with epic rewards? Totally worth starting!"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Vybaa - Catch the Vybe</title>
  </head>
  <body class="font-mona-sans-x text-white [&_*]:text-left">
    <style>
      .loader {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translate(-50%, -50%);
        transition: all 0.5s ease;
        background-color: #06050960;
        border-color: transparent;
      }

      .loaded .loader {
        opacity: 0;
        border-color: transparent;
      }

      body.loaded #app {
        opacity: 1;
      }

      #app {
        opacity: 1;
        border-color: transparent;
      }

      .transit {
        transition: all 1s ease;
        animation: transit 0.4s ease;
      }

      .loader span {
        color: #FF266F;
        font-weight: bolder;
        font-family: Arial, Helvetica, sans-serif;
        transform: scaleX(1.3);
         animation: transit 0.4s ease;
         font-size: large;
      }

      @keyframes transit {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
    </style>
    <div class="loader">
      <span>VYBAA</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
